short_bio: >-
  <p>
    I am an undergraduate student in Software Engineering at Guangdong University of Foreign Studies (GDUFS),
    where I am a member of the Data Mining Lab. My research interests lie in <strong>Large Language Models</strong> and
    <strong>Natural Language Processing</strong>. During my work at the Data Mining Lab, I have worked on multilingual/Chinese
    text error correction, as well as sentiment classification.
  </p>
  <p>
    I am currently a visiting student at Singapore Management University (SMU), conducting research on Trustworthy AI for Social Good.
